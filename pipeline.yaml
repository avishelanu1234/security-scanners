name: Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -c bandit.yaml -f json -o bandit-report.json

      - name: Fail on high severity issues
        run: |
          python -c "import json; report=json.load(open('bandit-report.json')); assert all(issue['issue_severity'] != 'HIGH' for issue in report['results']), 'High severity issues found!'

      - name: Upload Bandit scan report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Notify security team (placeholder)
        run: echo "Notify security team with Bandit report"

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application (example)
        run: |
          # TODO: Replace this with actual application start command
          sleep 10 &

      - name: Wait for application to be ready
        run: |
          for i in {1..10}; do
            curl -sSf http://localhost:8080 && break || sleep 5
          done

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP full scan
        run: |
          zap-full-scan.py -t http://localhost:8080 -r zap-report.html -f html,json -J zap-report.json

      - name: Fail on critical vulnerabilities
        run: |
          python -c "import json; report=json.load(open('zap-report.json')); assert all(alert['risk'] != 'High' for alert in report['site'][0]['alerts']), 'Critical vulnerabilities found!'

      - name: Upload ZAP scan reports
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json

      - name: Notify security team (placeholder)
        run: echo "Notify security team with ZAP reports"
