name: Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json

      - name: Upload Bandit scan report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Fail on high severity issues
        run: |
          if bandit -r . -f json | jq '.results[] | select(.issue_severity == "HIGH")' | grep .; then exit 1; fi
        shell: bash

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: sast_scan

    env:
      TARGET_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # TODO: Replace with actual app startup command
          echo "Starting application..."
          sleep 10 &

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan
        run: |
          zap-baseline.py -t ${{ env.TARGET_URL }} -r zap-report.html

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail on high risk alerts
        run: |
          if grep -q "High" zap-report.html; then exit 1; fi
        shell: bash

# Recommendations:
# - Ensure secrets are not exposed in logs or artifacts.
# - Add notifications for scan failures or critical vulnerabilities.
# - Consider parallelizing scans if feasible.
# - Add additional scanners as needed for comprehensive coverage.
