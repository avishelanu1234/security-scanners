# Configuration for Security Scanners

# Whitelist for known false positives
whitelist:
  # Removed sensitive entries to ensure actual secrets are not ignored during scans

# Sensitivity level for scanning
sensitivity_level: medium

# Parameters for scanning
scanning_parameters:
  enable_incremental_scanning: true
  enable_parallel_scanning: true

# Logging configuration
logging:
  level: info # Consider changing to 'warn' or 'error' during production
  format: '%(asctime)s - %(levelname)s - %(message)s - User ID: %(user_id)s - IP: %(ip_address)s'

# Log retention policy
log_retention:
  duration: '30 days' # Adjust retention duration as needed

# Log analysis and alerts
log_analysis:
  enable_alerts: true
  alert_threshold: 'high' # Set threshold for alerts