name: Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit, detect-secrets, and safety
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets safety

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > .secrets.baseline
          detect-secrets audit .secrets.baseline

      - name: Run safety dependency check
        run: |
          safety check --json > safety-report.json || true

      - name: Upload scan reports
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            .secrets.baseline
            safety-report.json

      - name: Fail on high severity Bandit issues
        run: |
          if bandit -r . -f json | jq '.results[] | select(.issue_severity == "HIGH")' | grep .; then exit 1; fi
        shell: bash

      - name: Fail on vulnerable dependencies
        run: |
          if jq '.vulnerabilities | length > 0' safety-report.json | grep true; then exit 1; fi
        shell: bash

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest

    env:
      TARGET_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # Replace with actual app startup command
          echo "Starting application with secure config..."
          # Start app in background
          ./start_app.sh &

      - name: Wait for application to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf ${{ env.TARGET_URL }}/health; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app to be ready..."
            sleep 5
          done
          echo "App failed to start"
          exit 1

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan with authentication and API key
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          zap-baseline.py -t ${{ env.TARGET_URL }} -r zap-report.html -z "-config api.key=${{ env.ZAP_API_KEY }}" -z "-auth username=admin password=admin"

      - name: Parse ZAP scan report
        run: |
          grep -q "High" zap-report.html && echo "High risk issues found!" || echo "No high risk issues found."

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail on high risk alerts
        run: |
          if grep -q "High" zap-report.html; then exit 1; fi
        shell: bash

  notify:
    name: Notify on Scan Failures
    runs-on: ubuntu-latest
    needs: [sast_scan, dast_scan]
    if: failure()

    steps:
      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            Security scan pipeline failed. Please review the reports.
            - Bandit report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - ZAP report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Safety report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# Notes:
# - Parallelized SAST and DAST jobs for efficiency.
# - Added dependency vulnerability scanning using safety.
# - Added health check after app startup for DAST.
# - Improved failure notifications with report links.
# - Ensure to replace ./start_app.sh with actual app start command.
# - Secrets should be masked and not exposed in logs.
