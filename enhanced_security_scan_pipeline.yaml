name: Enhanced Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1'  # Weekly scan at 2 AM every Monday

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit and detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json --severity-level high

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > .secrets.baseline
          detect-secrets audit .secrets.baseline --all-files --no-banner

      - name: Upload SAST and secrets scan reports
        uses: actions/upload-artifact@v3
        with:
          name: sast-and-secrets-reports
          path: |
            bandit-report.json
            .secrets.baseline

      - name: Fail build on high severity SAST issues or detected secrets
        run: |
          bandit_issues=$(jq '.results | map(select(.issue_severity == "HIGH")) | length' bandit-report.json)
          if [ "$bandit_issues" -gt 0 ]; then
            echo "High severity SAST issues found."
            exit 1
          fi
          if detect-secrets scan | grep -q 'Potential secret detected'; then
            echo "Secrets detected."
            exit 1
          fi

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # Replace with your actual application start command
          ./start-app.sh &
          # Wait for app to be available
          for i in {1..30}; do
            curl -s http://localhost:8080/health && break || sleep 2
          done

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan
        run: |
          zap-baseline.py -t http://localhost:8080 -r zap-report.html --hook ./zap-auth-hook.py

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail build on critical vulnerabilities
        run: |
          grep -q 'High' zap-report.html || exit 0
          echo "Critical vulnerabilities found in DAST scan."
          exit 1

  compliance_check:
    name: Compliance and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run dependency vulnerability scan
        run: |
          python -m pip install safety
          safety check

      - name: Run secrets scan with TruffleHog
        uses: trufflesecurity/trufflehog@v2
        with:
          args: --json

      - name: Upload compliance reports
        uses: actions/upload-artifact@v3
        with:
          name: compliance-reports
          path: ./compliance-reports

      - name: Map scan results to compliance frameworks
        run: |
          echo "Mapping Bandit, ZAP, and compliance findings to OWASP Top 10 and PCI-DSS..."
          # Implement mapping scripts here

      - name: Create issues for vulnerabilities
        run: |
          echo "Automate GitHub issue creation for high severity vulnerabilities"
          # Implement issue creation automation here

  notify:
    name: Notify on Scan Failures
    runs-on: ubuntu-latest
    needs: [sast_scan, dast_scan, compliance_check]
    if: failure()

    steps:
      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "Security scan pipeline failed. Please review the reports."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
