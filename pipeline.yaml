name: Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit and detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.4 detect-secrets==1.0.3

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > .secrets.baseline
          detect-secrets audit .secrets.baseline --all-files --no-banner

      - name: Run custom SAST runner
        run: |
          python scanners/sast_runner.py

      - name: Run custom secret scanner
        run: |
          python -c "import scanners.secret_scanner as ss; import os, glob; \nfiles = glob.glob('**/*.py', recursive=True); \nscanner = ss.SecretScanner(); \nviolations = []; \nfor file in files: \n with open(file, 'r') as f: \n  code = f.read(); \n  violations.extend(scanner.scan_code(code)); \nif violations: \n print('Secrets detected:'); \n for v in violations: print(v); \n exit(1)"

      - name: Upload Bandit and Secrets scan reports
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            .secrets.baseline

      - name: Fail on high severity issues
        run: |
          if bandit -r . -f json | jq '.results[] | select(.issue_severity == "HIGH")' | grep .; then exit 1; fi
        shell: bash

      - name: Post Bandit SAST scan results as PR comment
        run: |
          python scripts/pr_comment_bandit.py

      - name: Post Secrets scan results as PR comment
        run: |
          python scripts/pr_comment_secrets.py

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    # Removed 'needs' to run in parallel with sast_scan

    env:
      TARGET_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # (Updated) Secure application start command
          ./scripts/start_application.sh &
          # Health check loop to wait until app is ready
          for i in {1..30}; do
            if curl -sSf ${{ env.TARGET_URL }}/health; then
              echo "Application is ready"
              break
            else
              echo "Waiting for application to be ready..."
              sleep 2
            fi
          done
          if ! curl -sSf ${{ env.TARGET_URL }}/health; then
            echo "Application failed to start"
            exit 1
          fi

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy=2.11.1-1

      - name: Run OWASP ZAP baseline scan with authentication and API key
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          zap-baseline.py -t ${{ env.TARGET_URL }} -r zap-report.html -z "-config api.key=${{ env.ZAP_API_KEY }}" -z "-auth username=admin password=admin"

      - name: Parse ZAP scan report
        run: |
          grep -q "High" zap-report.html && echo "High risk issues found!" || echo "No high risk issues found."

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail on high risk alerts
        run: |
          if grep -q "High" zap-report.html; then exit 1; fi
        shell: bash

      - name: Post ZAP DAST scan results as PR comment
        run: |
          python scripts/pr_comment_zap.py

  notify:
    name: Notify on Scan Failures
    runs-on: ubuntu-latest
    needs: [sast_scan, dast_scan]
    if: failure()

    steps:
      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: "Security scan pipeline failed. Please review the reports."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# Recommendations:
# - Ensure secrets are not exposed in logs or artifacts.
# - Add notifications for scan failures or critical vulnerabilities.
# - Consider parallelizing scans if feasible.
# - Add additional scanners as needed for comprehensive coverage.
