# Configuration for Security Scanners

# Whitelist for known false positives
whitelist:
  - hardcoded_api_key
  - known_secret
  - legacy_token
  - temp_password
  - test_api_key

# Sensitivity level for scanning
sensitivity_level: low

# Parameters for scanning
scanning_parameters:
  enable_incremental_scanning: true
  enable_parallel_scanning: true

# Logging configuration
logging:
  level: info
  format: '%(asctime)s - %(levelname)s - %(message)s'