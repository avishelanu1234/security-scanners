name: Enhanced Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1'  # Weekly scan at 2 AM every Monday

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit and additional SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          # Example: install other SAST tools for other languages if needed

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json --severity-level high

      - name: Upload Bandit scan report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Fail build on high severity issues
        run: |
          jq '.results | map(select(.issue_severity == "HIGH")) | length' bandit-report.json | grep -q '^0$' || exit 1

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: sast_scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # Replace with your actual application start command
          ./start-app.sh &
          # Wait for app to be available
          for i in {1..30}; do
            curl -s http://localhost:8080/health && break || sleep 2
          done

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan
        run: |
          zap-baseline.py -t http://localhost:8080 -r zap-report.html --hook ./zap-auth-hook.py

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail build on critical vulnerabilities
        run: |
          grep -q 'High' zap-report.html || exit 0
          echo "Critical vulnerabilities found in DAST scan."
          exit 1

  compliance_check:
    name: Compliance and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run dependency vulnerability scan
        run: |
          # Example using safety for Python
          python -m pip install safety
          safety check

      - name: Run secrets scan
        uses: trufflesecurity/trufflehog@v2
        with:
          args: --json

      - name: Upload compliance reports
        uses: actions/upload-artifact@v3
        with:
          name: compliance-reports
          path: ./compliance-reports

      - name: Map scan results to compliance frameworks
        run: |
          echo "Mapping Bandit and ZAP findings to OWASP Top 10 and PCI-DSS..."
          # Implement mapping scripts here

      - name: Create issues for vulnerabilities
        run: |
          # Example placeholder for issue creation automation
          echo "Create GitHub issues for high severity vulnerabilities"
