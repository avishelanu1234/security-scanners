name: Security Scan Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast_scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit, detect-secrets, and safety
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets safety

      - name: Run Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > .secrets.baseline
          detect-secrets audit .secrets.baseline

      - name: Run dependency vulnerability scan with Safety
        run: safety check -r requirements.txt --json > safety-report.json || true

      - name: Upload scan reports
        uses: actions/upload-artifact@v3
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            .secrets.baseline
            safety-report.json

      - name: Fail on high severity Bandit issues
        run: |
          if bandit -r . -f json | jq '.results[] | select(.issue_severity == "HIGH")' | grep .; then exit 1; fi
        shell: bash

  dast_scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest

    env:
      TARGET_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start application
        run: |
          # Replace with actual app startup command
          echo "Starting application with secure config..."
          sleep 10 &

      - name: Install OWASP ZAP
        run: |
          sudo apt-get update && sudo apt-get install -y zaproxy

      - name: Run OWASP ZAP baseline scan with authentication and API key
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
        run: |
          zap-baseline.py -t ${{ env.TARGET_URL }} -r zap-report.html -z "-config api.key=${{ env.ZAP_API_KEY }}" -z "-auth username=admin password=admin"

      - name: Parse ZAP scan report
        run: |
          grep -q "High" zap-report.html && echo "High risk issues found!" || echo "No high risk issues found."

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail on high risk alerts
        run: |
          if grep -q "High" zap-report.html; then exit 1; fi
        shell: bash

  dependency_scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Run Safety dependency scan
        run: safety check -r requirements.txt --json > safety-report.json || true

      - name: Upload Safety scan report
        uses: actions/upload-artifact@v3
        with:
          name: safety-scan-report
          path: safety-report.json

  notify:
    name: Notify on Scan Failures or Critical Findings
    runs-on: ubuntu-latest
    needs: [sast_scan, dast_scan, dependency_scan]
    if: failure() || success()

    steps:
      - name: Download scan reports
        uses: actions/download-artifact@v3
        with:
          path: ./reports

      - name: Analyze reports and determine message
        id: analyze
        run: |
          # Simple analysis example - In practice, use scripts or tools to parse JSON reports
          if grep -q "HIGH" ./reports/bandit-report.json || grep -q "High" ./reports/zap-report.html || grep -q "HIGH" ./reports/safety-report.json; then
            echo "message=Critical vulnerabilities detected! Please review the scan reports." >> $GITHUB_OUTPUT
            exit 1
          else
            echo "message=Security scans completed successfully with no critical issues." >> $GITHUB_OUTPUT
          fi

      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: ${{ steps.analyze.outputs.message }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# Notes:
# - Parallelized SAST, DAST, and Dependency scans.
# - Added dependency vulnerability scanning using Safety.
# - Enhanced notification with critical vulnerabilities alert.
# - Kept secrets usage limited to environment variables.
# - Upload and download scan reports for centralized analysis.
# - Application startup command in DAST remains a placeholder for real command.
